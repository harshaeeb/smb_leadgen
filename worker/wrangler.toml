name = "smb-leadgen"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Workers Paid plan. Raises the CPU ceiling to 5 minutes so a large batch
# can't be killed mid-run. Note this is CPU time, not wall time -- the 8s
# site-probe waits are network I/O and don't count against it. Wall time is
# unlimited for HTTP-triggered Workers while the client stays connected,
# which is what lets this stream results without a storage layer.
[limits]
cpu_ms = 300000

# Deliberately off. The whole auth model is Cloudflare Access sitting in
# front of a route -- a live *.workers.dev URL would bypass Access entirely
# and let anyone spend the Google Places key. Deploy to a custom domain
# route instead, and put an Access application in front of it.
# See README.md "Deploying" before changing this.
workers_dev = false

# routes = [
#   { pattern = "leads.yourdomain.com", custom_domain = true }
# ]

[vars]
# Both must be set or the Worker fails closed (503) rather than serving
# unauthenticated. From the Access application you create:
#   ACCESS_TEAM_DOMAIN = "yourteam.cloudflareaccess.com"
#   ACCESS_AUD         = the Application Audience (AUD) tag
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""

# Secret, never a var -- set with:
#   npx wrangler secret put GOOGLE_PLACES_API_KEY
